<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glow | Beranda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GlowTrack</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="rutinitas/daftar.html">Daftar Rutinitas</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container py-4 flex-grow-1">
        <section class="hero rounded-4 p-4 p-md-5 mb-4 text-white">
            <h1 class="display-6 fw-bold">Selamat Datang di GlowTrack</h1>
            <p class="lead mb-4">Catat dan atur rutinitas skincare kamu setiap hari, pagi maupun malam.</p>
            <a href="rutinitas/daftar.html" class="btn btn-hero rounded-pill px-4 me-2 mb-2">Lihat Rutinitas</a>
            <a href="rutinitas/tambah.html" class="btn btn-hero rounded-pill px-4 mb-2">Tambah Produk</a>
        </section>

        <h2 class="h4 fw-bold text-glow-dark mb-3">Ringkasan Rutinitas</h2>

        <div class="row g-3">
            <div class="col-12 col-md-4">
                <div class="card stat-card stat-total border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body">
                        <div class="text-muted small">Total Rutinitas</div>
                        <div class="stat-number">6</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card stat-card stat-pagi border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body">
                        <div class="text-muted small">Rutinitas Pagi</div>
                        <div class="stat-number">3</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card stat-card stat-malam border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body">
                        <div class="text-muted small">Rutinitas Malam</div>
                        <div class="stat-number">3</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted border-top bg-white py-3">
        <small>&copy; 2026 GlowTrack &mdash; Skincare Routine</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
